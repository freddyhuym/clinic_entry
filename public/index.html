<!DOCTYPE html>
<html lang="zh-Hant">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<body>

<div class="page-glow" aria-hidden="true"></div>
<div class="leaf leaf-tl" aria-hidden="true"></div>

<header class="hero">

<main class="stage">

    <svg class="web" id="web" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
    <div class="core" id="core">

      <div class="core-mark" id="coreMark"></div>
      <div class="core-text">
        <span class="core-zh">醫境</span>

  <div class="value"><b>專業團隊</b><span>經驗豐富　醫師群聯合把關</span></div>

</section>

<footer class="footer">
  <span class="footer-line">美 的 每 一 步 ・ 我 們 都 在 您 身 邊</span>
  <small>© <span id="year"></span> 醫境醫療集團 MediRealm Medical Group</small>
</footer>

<script src="/app.js"></script>
