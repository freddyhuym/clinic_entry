<svg xmlns="http://www.w3.org/2000/svg" viewBox="-120 -120 240 240" role="img" aria-label="醫境醫療 YIJING MEDICAL">
  <defs>
    <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E4BE7C"/>
      <stop offset="1" stop-color="#CE9A4B"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A6B4C"/>
      <stop offset="1" stop-color="#2E4530"/>
    </linearGradient>
    <linearGradient id="gTeal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8CC8C2"/>
      <stop offset="1" stop-color="#59AAA5"/>
    </linearGradient>
  </defs>

  <!-- 三道流動緞帶：金（集團）、深綠（曜妍）、霧青綠（纖顏） -->
  <g>
    <path d="M 90 0 A 85 85 0 0 0 -57.85 -68.94 A 135 135 0 0 1 90 0 Z" fill="url(#gGold)"/>
    <path d="M 90 0 A 85 85 0 0 0 -57.85 -68.94 A 135 135 0 0 1 90 0 Z" fill="url(#gGreen)" transform="rotate(120)"/>
    <path d="M 90 0 A 85 85 0 0 0 -57.85 -68.94 A 135 135 0 0 1 90 0 Z" fill="url(#gTeal)" transform="rotate(240)"/>
  </g>

  <!-- 中央細金圓：專業、精準的醫學核心 -->
  <circle cx="0" cy="0" r="34" fill="none" stroke="url(#gGold)" stroke-width="1.5" opacity="0.85"/>
  <!-- 極簡醫學十字 -->
  <g stroke="#CE9A4B" stroke-width="2.5" stroke-linecap="round" opacity="0.9">
    <line x1="0" y1="-11" x2="0" y2="11"/>
    <line x1="-11" y1="0" x2="11" y2="0"/>
  </g>
</svg>
